<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Warehouse with loading docks and trucks">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd7ff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect y="430" width="800" height="170" fill="#7a8599"/>
  <g fill="#f2f4f8"><rect x="60" y="510" width="80" height="8"/><rect x="220" y="510" width="80" height="8"/><rect x="380" y="510" width="80" height="8"/><rect x="540" y="510" width="80" height="8"/><rect x="700" y="510" width="80" height="8"/></g>

  <!-- building -->
  <path d="M60 430 V220 L400 140 L740 220 V430 Z" fill="#e3e8f1"/>
  <path d="M60 220 L400 140 L740 220 L740 240 L400 162 L60 240 Z" fill="#3b6fd8"/>
  <rect x="60" y="250" width="680" height="40" fill="#cfd7e5"/>
  <text x="400" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2a3552" letter-spacing="6">DISTRIBUTION CENTER</text>
  <g fill="#9fb8de"><rect x="100" y="300" width="40" height="26"/><rect x="160" y="300" width="40" height="26"/><rect x="600" y="300" width="40" height="26"/><rect x="660" y="300" width="40" height="26"/></g>
  <!-- docks -->
  <g>
    <rect x="220" y="330" width="90" height="100" fill="#59647f"/><rect x="355" y="330" width="90" height="100" fill="#59647f"/><rect x="490" y="330" width="90" height="100" fill="#59647f"/>
    <g stroke="#7a86a1" stroke-width="3"><path d="M220 345h90M220 360h90M220 375h90M355 345h90M355 360h90M490 345h90M490 360h90M490 375h90M490 390h90"/></g>
    <rect x="355" y="380" width="90" height="50" fill="#2a3352"/>
  </g>
  <!-- truck at dock -->
  <g transform="translate(330 360)">
    <rect x="0" y="0" width="140" height="90" fill="#f6f8fc"/>
    <rect x="0" y="40" width="140" height="8" fill="#ffd166"/>
    <g><circle cx="30" cy="96" r="16" fill="#1c2233"/><circle cx="110" cy="96" r="16" fill="#1c2233"/></g>
  </g>
  <!-- forklift with pallet -->
  <g transform="translate(600 390)">
    <rect x="0" y="0" width="56" height="34" fill="#e8a33a"/><rect x="8" y="-30" width="34" height="30" fill="none" stroke="#2a3352" stroke-width="5"/>
    <rect x="56" y="-40" width="6" height="74" fill="#2a3352"/><rect x="62" y="24" width="40" height="5" fill="#2a3352"/>
    <path d="M66 -10 h34 v34 h-34z" fill="#c8925a"/><path d="M66 -10 l8 -6 h34 l-8 6z" fill="#e0b07a"/>
    <circle cx="12" cy="40" r="10" fill="#1c2233"/><circle cx="46" cy="40" r="10" fill="#1c2233"/>
  </g>
</svg>
