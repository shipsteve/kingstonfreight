<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Cargo plane taking off from an international airport runway at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1633"/>
      <stop offset="0.55" stop-color="#2b3f7a"/>
      <stop offset="0.85" stop-color="#e58a5a"/>
      <stop offset="1" stop-color="#f6c27a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#0c1224"/>
    </linearGradient>
    <linearGradient id="runway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3550"/>
      <stop offset="1" stop-color="#3b4563"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3a6fb8" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="930" cy="470" r="170" fill="url(#sun)"/>
  <g fill="#fff" opacity="0.8">
    <circle cx="120" cy="80" r="1.6"/><circle cx="260" cy="140" r="1.2"/><circle cx="420" cy="60" r="1.4"/>
    <circle cx="610" cy="120" r="1"/><circle cx="760" cy="50" r="1.5"/><circle cx="1040" cy="110" r="1.2"/>
    <circle cx="1130" cy="40" r="1"/><circle cx="330" cy="210" r="1"/><circle cx="880" cy="180" r="1.1"/>
  </g>

  <!-- distant city skyline -->
  <g fill="#18213d" opacity="0.85">
    <rect x="0" y="470" width="60" height="70"/><rect x="60" y="440" width="40" height="100"/>
    <rect x="100" y="480" width="70" height="60"/><rect x="170" y="420" width="35" height="120"/>
    <rect x="205" y="460" width="60" height="80"/><rect x="1010" y="455" width="50" height="85"/>
    <rect x="1060" y="430" width="40" height="110"/><rect x="1100" y="470" width="100" height="70"/>
  </g>

  <rect y="530" width="1200" height="270" fill="url(#ground)"/>

  <!-- terminal building -->
  <g>
    <path d="M250 530 L250 460 Q470 410 690 460 L690 530 Z" fill="#26324f"/>
    <path d="M262 528 L262 470 Q470 428 678 470 L678 528 Z" fill="url(#glass)" opacity="0.55"/>
    <g stroke="#1a2440" stroke-width="3" opacity="0.7">
      <line x1="300" y1="462" x2="300" y2="528"/><line x1="345" y1="452" x2="345" y2="528"/>
      <line x1="390" y1="445" x2="390" y2="528"/><line x1="435" y1="441" x2="435" y2="528"/>
      <line x1="480" y1="440" x2="480" y2="528"/><line x1="525" y1="442" x2="525" y2="528"/>
      <line x1="570" y1="446" x2="570" y2="528"/><line x1="615" y1="453" x2="615" y2="528"/>
      <line x1="660" y1="463" x2="660" y2="528"/>
    </g>
    <text x="470" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e8f1ff" letter-spacing="3">INTERNATIONAL AIRPORT</text>
  </g>

  <!-- control tower -->
  <g>
    <rect x="745" y="390" width="26" height="140" fill="#2a3656"/>
    <path d="M722 372 h72 l-8 26 h-56 z" fill="#2a3656"/>
    <rect x="728" y="350" width="60" height="24" rx="3" fill="url(#glass)"/>
    <rect x="752" y="330" width="12" height="20" fill="#2a3656"/>
    <circle cx="758" cy="326" r="5" fill="#ff5a5a"/>
  </g>

  <!-- cargo hangar -->
  <g>
    <path d="M820 530 V470 Q905 430 990 470 V530 Z" fill="#202b47"/>
    <rect x="850" y="485" width="110" height="45" fill="#121a30"/>
    <text x="905" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffd166" letter-spacing="2">CARGO</text>
  </g>

  <!-- runway in perspective -->
  <path d="M520 560 L680 560 L1200 800 L0 800 Z" fill="url(#runway)"/>
  <g fill="#e9eef8">
    <path d="M596 572 h8 l3 14 h-14 z"/><path d="M594 600 h12 l5 24 h-22 z"/>
    <path d="M591 645 h18 l7 34 h-32 z"/><path d="M587 705 h26 l10 50 h-46 z"/>
  </g>
  <g>
    <path d="M520 560 L0 800" stroke="#e9eef8" stroke-width="3"/>
    <path d="M680 560 L1200 800" stroke="#e9eef8" stroke-width="3"/>
  </g>
  <!-- edge lights -->
  <g>
    <circle cx="505" cy="568" r="7" fill="url(#light)"/><circle cx="455" cy="591" r="9" fill="url(#light)"/>
    <circle cx="385" cy="623" r="11" fill="url(#light)"/><circle cx="290" cy="667" r="14" fill="url(#light)"/>
    <circle cx="160" cy="727" r="18" fill="url(#light)"/>
    <circle cx="695" cy="568" r="7" fill="url(#light)"/><circle cx="745" cy="591" r="9" fill="url(#light)"/>
    <circle cx="815" cy="623" r="11" fill="url(#light)"/><circle cx="910" cy="667" r="14" fill="url(#light)"/>
    <circle cx="1040" cy="727" r="18" fill="url(#light)"/>
  </g>

  <!-- cargo plane climbing -->
  <g transform="translate(610 250) rotate(-14)">
    <path d="M-230 0 Q-240 -22 -200 -26 L170 -26 Q240 -24 262 0 Q240 24 170 24 L-200 24 Q-240 22 -230 0 Z" fill="#eef3fb"/>
    <path d="M200 -16 Q238 -14 252 0 L200 0 Z" fill="#7fa8dd"/>
    <path d="M-30 6 L-110 120 L-70 120 L60 10 Z" fill="#d9e2f0"/>
    <path d="M-30 -6 L-90 -84 L-60 -84 L40 -10 Z" fill="#c8d4e8"/>
    <path d="M-200 -20 L-250 -110 L-215 -110 L-160 -24 Z" fill="#3b6fd8"/>
    <path d="M-200 10 L-245 50 L-220 50 L-175 14 Z" fill="#c8d4e8"/>
    <rect x="-70" y="40" width="44" height="18" rx="9" fill="#9aa9c2"/>
    <rect x="-110" y="74" width="44" height="18" rx="9" fill="#9aa9c2"/>
    <rect x="-150" y="-8" width="300" height="5" fill="#3b6fd8"/>
    <g fill="#3a4a6a"><circle cx="150" cy="-12" r="3.5"/><circle cx="130" cy="-12" r="3.5"/><circle cx="110" cy="-12" r="3.5"/></g>
    <text x="0" y="-11" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#3b6fd8" letter-spacing="2">AIR CARGO</text>
    <circle cx="262" cy="0" r="4" fill="#ff5a5a"/>
  </g>
  <path d="M370 330 Q250 390 120 430" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
